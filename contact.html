<main id="contact_page">

    <h2>Contact the Orchestra</h2>
    <p>
        Have a question about the orchestra program, performances, or upcoming events?
        Please send us a message.
    </p>

    <form>
        <label for="fname">First Name</label><br>
        <input type="text" id="fname" name="fname"><br>

        <label for="lname">Last Name</label><br>
        <input type="text" id="lname" name="lname"><br>

        <label for="email">Email</label><br>
        <input type="text" id="email" name="email"><br>
    
       
    <p>Choose your grade:</p>
    
        <label for="6th grade">6th Grade</label><br>
        <input type="radio" id="6th grade" name="grade"><br>
        <label for="7th grade">7th Grade</label><br>
        <input type="radio" id="7th grade" name="grade"><br>
        <label for="8th grade">8th Grade</label><br>
        <input type="radio" id="8th grade" name="grade"><br>
    

    <P>Instruments</P>
    
        <label for="instrument:"></label>
        <select id="instrument" name="instrument">
            <option value="violin">Violin</option>
            <option value="viola">Viola</option>
            <option value="cello">Cello</option>
            <option value="dbase">Double Bass</option>
        </select>
    

    <p>Message</p>
    
    <textarea name="message" rows="7" cols="40"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

    </form>
